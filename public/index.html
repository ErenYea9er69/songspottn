<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SongSpot TN — Guess the Tunisian Track (Rap & Musique)</title>
  <meta name="description" content="Test your ear with SongSpot TN. Guess the mystery Tunisian rap or classic song from a 0.1s snippet before hints unlock." />
  <link rel="stylesheet" href="/styles/main.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23d4af37'><circle cx='12' cy='12' r='10'/><polygon points='10 8 16 12 10 16 10 8' fill='%23070709'/></svg>" />
</head>
<body>
  <!-- Victory Confetti Canvas Overlay -->
  <canvas id="confetti-canvas" class="confetti-overlay" aria-hidden="true"></canvas>

  <div class="app-container">
    <!-- Top Brand & Utilities Header -->
    <header class="app-header">
      <div class="brand-section">
        <div class="brand-logo" aria-hidden="true">
          <div class="logo-inner">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8" fill="none"/>
              <circle cx="12" cy="12" r="3.5" fill="currentColor"/>
              <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="pulse-ring"></span>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">SongSpot TN</h1>
          <span class="brand-subtitle">Rap & Musique Tunisienne 🇹🇳</span>
        </div>
      </div>

      <div class="header-tools">
        <!-- Sound FX Toggle -->
        <button id="sfx-toggle-btn" class="tool-btn" title="Toggle Sound Effects" aria-label="Toggle Sound Effects">
          <svg id="sfx-icon-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
          <svg id="sfx-icon-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
        </button>

        <!-- New Game Button -->
        <button id="new-game-btn" class="tool-btn" title="New Game" aria-label="Restart New Game">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Genre Pill Scroll Shelf -->
    <nav class="genre-shelf" aria-label="Music Genres">
      <div class="genre-pills" id="genre-pills">
        <button class="genre-pill is-active" data-genre="rap-all"><span>🎤</span> Rap TN Top Hits</button>
        <button class="genre-pill" data-genre="rap-drill"><span>⚡</span> Samara & Sanfara</button>
        <button class="genre-pill" data-genre="rap-legends"><span>👑</span> Balti & Kafon</button>
        <button class="genre-pill" data-genre="mezwed-tounsi"><span>🪘</span> Mezwed & Rboukh</button>
        <button class="genre-pill" data-genre="classics-tounsi"><span>📻</span> Tarab Tounsi</button>
        <button class="genre-pill" data-genre="random-tounsi"><span>🎲</span> 100% Tounsi Mix</button>
      </div>
    </nav>

    <!-- HUD Bar (Score & Round Indicators) -->
    <section class="game-hud" aria-label="Game Status">
      <div class="hud-stat">
        <span class="hud-label">Total Score</span>
        <div class="hud-value-row">
          <span id="score-value" class="hud-value">0</span>
          <span class="hud-unit">PTS</span>
        </div>
      </div>

      <div class="hud-divider" aria-hidden="true"></div>

      <div class="hud-stat">
        <span class="hud-label">Rounds (5)</span>
        <div id="round-indicators" class="round-rack" aria-label="Rounds progression">
          <!-- Injected via JS -->
        </div>
      </div>
    </section>

    <!-- Main Analog Deck -->
    <main class="deck-surface">
      <!-- Turntable & Equalizer Stage -->
      <section class="turntable-stage" aria-label="Turntable Deck">
        <!-- Vinyl Record Visualizer -->
        <div class="turntable-assembly">
          <div id="turntable-vinyl" class="vinyl-disc" aria-hidden="true">
            <div class="vinyl-groove groove-1"></div>
            <div class="vinyl-groove groove-2"></div>
            <div class="vinyl-groove groove-3"></div>
            <div class="vinyl-center-label">
              <div class="label-dot"></div>
              <span class="label-text">SONGSPOT</span>
            </div>
            <div class="vinyl-sheen"></div>
          </div>

          <!-- Tone Arm Stylus -->
          <div id="turntable-tonearm" class="tonearm" aria-hidden="true">
            <div class="arm-base"></div>
            <div class="arm-rod"></div>
            <div class="arm-cartridge"></div>
          </div>
        </div>

        <!-- 16-Band Dynamic Spectrum Visualizer -->
        <div id="spectrum-bars" class="spectrum-rack" aria-hidden="true">
          <div class="spectrum-bar"><div class="bar-level"></div></div>
          <div class="spectrum-bar"><div class="bar-level"></div></div>
          <div class="spectrum-bar"><div class="bar-level"></div></div>
          <div class="spectrum-bar"><div class="bar-level"></div></div>
          <div class="spectrum-bar"><div class="bar-level"></div></div>
          <div class="spectrum-bar"><div class="bar-level"></div></div>
          <div class="spectrum-bar"><div class="bar-level"></div></div>
          <div class="spectrum-bar"><div class="bar-level"></div></div>
          <div class="spectrum-bar"><div class="bar-level"></div></div>
          <div class="spectrum-bar"><div class="bar-level"></div></div>
          <div class="spectrum-bar"><div class="bar-level"></div></div>
          <div class="spectrum-bar"><div class="bar-level"></div></div>
          <div class="spectrum-bar"><div class="bar-level"></div></div>
          <div class="spectrum-bar"><div class="bar-level"></div></div>
          <div class="spectrum-bar"><div class="bar-level"></div></div>
          <div class="spectrum-bar"><div class="bar-level"></div></div>
        </div>

        <!-- Primary Tactile Play Button -->
        <div class="playback-control">
          <button id="play-btn" class="btn-tactile-play" aria-label="Play audio clip" title="Listen to current clip duration">
            <div class="play-inner-disc">
              <span id="play-btn-icon" class="play-icon-wrap">
                <svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor">
                  <polygon points="6 3 20 12 6 21 6 3"/>
                </svg>
              </span>
            </div>
            <div class="play-glow-ring"></div>
          </button>
          <div class="play-meta">
            <span id="play-btn-label" class="play-stage-badge">Play (0.1s)</span>
            <span class="play-hint">Press <kbd>Space</kbd></span>
          </div>
        </div>

        <!-- LED Channel Timeline Segments -->
        <div class="timeline-rack">
          <div id="timeline-segments" class="timeline-channels" aria-label="Snippet duration progression">
            <!-- 5 segments rendered via JavaScript -->
          </div>
        </div>

        <!-- Guesses Feed -->
        <div id="guess-history" class="guess-feed" aria-live="polite">
          <div class="feed-empty-hint">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            <span>Play the clip and search for the track name</span>
          </div>
        </div>
      </section>

      <!-- Search & Guessing Console -->
      <section class="console-stage" aria-label="Search and Submit">
        <div class="search-field-wrap">
          <span class="search-prefix-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </span>
          <input
            type="text"
            id="search-input"
            class="console-input"
            placeholder="Search title or rapper (ex: Ya Lili, Samara, Balti, Kaso...)"
            aria-label="Search song title or artist"
            spellcheck="false"
          />
        </div>

        <!-- Autocomplete Suggestions Dropdown -->
        <div id="autocomplete-dropdown" class="autocomplete-popover" role="listbox" aria-label="Song search results">
          <!-- Injected via JavaScript -->
        </div>

        <!-- Dual Action Buttons -->
        <div class="console-actions">
          <button id="skip-btn" class="btn-console btn-console-skip" aria-label="Skip to next duration">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 4 15 12 5 20 5 4"/>
              <line x1="19" y1="5" x2="19" y2="19"/>
            </svg>
            <span id="skip-btn-label">Skip (+0.4s to 0.5s)</span>
          </button>

          <button id="submit-guess-btn" class="btn-console btn-console-submit" disabled aria-label="Submit Guess">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            <span>Submit Guess</span>
          </button>
        </div>
      </section>
    </main>

    <!-- Minimal Keyboard Footer -->
    <footer class="app-footer">
      <span><kbd>Space</kbd> Play / Pause</span>
      <span>•</span>
      <span><kbd>↑</kbd><kbd>↓</kbd> Browse suggestions</span>
      <span>•</span>
      <span><kbd>Enter</kbd> Guess</span>
    </footer>
  </div>

  <!-- Round Reveal Modal -->
  <div id="round-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="round-result-title">
    <div class="modal-panel">
      <div class="modal-status-pill">
        <h2 id="round-result-title" class="status-won">SPOT ON!</h2>
        <span id="round-score-badge" class="score-pill score-won">+1000 PTS</span>
      </div>

      <div class="album-art-stage">
        <img id="round-cover-img" class="album-art-img" src="" alt="Album Artwork" />
        <div class="art-reflection"></div>
      </div>

      <div class="track-reveal-info">
        <h3 id="round-track-title" class="track-title-text">Song Title</h3>
        <p id="round-artist-name" class="artist-name-text">Artist Name</p>
      </div>

      <div class="modal-button-group">
        <button id="round-play-full-btn" class="btn-modal btn-modal-preview">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          Listen to Full Preview (30s)
        </button>
        <button id="round-next-btn" class="btn-modal btn-modal-advance">Next Round →</button>
      </div>
    </div>
  </div>

  <!-- Game Over Summary Modal -->
  <div id="game-over-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="game-over-title">
    <div class="modal-panel game-over-panel">
      <div class="game-over-headline">
        <h2 id="game-over-title">Game Finished</h2>
        <div id="final-score" class="score-spotlight">0 / 5000</div>
        <div id="final-rank-badge" class="rank-trophy-badge rank-gold">Audiophile Maestro 🏆</div>
      </div>

      <div id="final-recap-list" class="recap-cards-list" aria-label="Round results breakdown">
        <!-- Injected via JavaScript -->
      </div>

      <button id="play-again-btn" class="btn-modal btn-modal-advance" style="width:100%;">Play Another Game ↺</button>
    </div>
  </div>

  <!-- Main Application Script -->
  <script type="module" src="/js/game.js"></script>
</body>
</html>
